[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencedesk"
version = "0.1.0"
description = "Investigação de incidentes de pedidos com evidências e revisão humana"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1", "uvicorn[standard]>=0.35,<1", "pydantic==2.13.5",
  "pydantic-settings>=2.10,<3", "sqlalchemy==2.0.54", "psycopg[binary]==3.3.6",
  "alembic>=1.16,<2", "argon2-cffi>=25,<26", "httpx>=0.28,<1",
  "openai==3.16.2", "pgvector>=0.4,<1", "pypdf>=6,<7",
  "prometheus-client>=0.22,<1", "opentelemetry-api>=1.35,<2",
  "opentelemetry-sdk>=1.35,<2", "opentelemetry-exporter-otlp-proto-http>=1.35,<2",
  "azure-storage-blob>=12.25,<13", "azure-identity>=1.23,<2",
  # Preserve upstream platform conditions when compiling locks on Linux.
  "uvloop==0.22.1; sys_platform != 'win32' and sys_platform != 'cygwin' and platform_python_implementation != 'PyPy'",
  "tzdata==2026.4; sys_platform == 'win32'",
  "colorama==0.4.6; sys_platform == 'win32'"
]

[project.optional-dependencies]
test = ["pytest>=8.4,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "mypy>=1.16,<2", "pip-tools>=7.4,<8"]
ml = ["sentence-transformers==6.1.0", "torch==2.14.0", "transformers==5.17.0", "datasets==5.0.1", "mlflow==3.16.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: PostgreSQL real e role de aplicação", "azure: chamadas pagas explícitas e limitadas"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["evidencedesk"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
