name: EvidenceDesk checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-development:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PYTHONPATH: backend/src
      ED_AI_PROVIDER: disabled
      AZURE_OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install documented Windows environment from hashes
        run: python -m pip install --require-hashes -r backend/requirements-test.lock -r scripts/requirements-docs.lock
      - run: python -m pip check
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python -m pytest backend/tests/unit -q
      - run: python scripts/check_repository_docs.py

  secret-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks CLI
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan complete Git history with redacted output
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --log-opts=--all .'

  backend-and-operation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: backend/src
      ED_DATABASE_URL: postgresql+psycopg://ed_app:ed_app_local_demo@127.0.0.1:5546/evidencedesk
      ED_MIGRATION_DATABASE_URL: postgresql+psycopg://ed_owner:ed_owner_local_demo@127.0.0.1:5546/evidencedesk
      ED_TEST_DATABASE_URL: postgresql+psycopg://ed_app:ed_app_local_demo@127.0.0.1:5547/evidencedesk
      ED_TEST_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:ed_admin_local_demo@127.0.0.1:5547/evidencedesk
      ED_AI_PROVIDER: disabled
      ED_STORAGE_ROOT: /tmp/evidencedesk-ci/objects
      ED_DELETION_LEDGER_ROOT: /tmp/evidencedesk-ci/ledger
      ED_MAINTENANCE_TEST_DATABASE_URL: postgresql+psycopg://ed_app:ed_app_local_demo@127.0.0.1:5547/evidencedesk
      ED_MAINTENANCE_TEST_OWNER_URL: postgresql+psycopg://ed_owner:ed_owner_local_demo@127.0.0.1:5547/evidencedesk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: backend/requirements-test.lock
      - name: Install pinned dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements-test.lock
          python -m pip install --require-hashes -r scripts/requirements-docs.lock
      - name: Code checks
        run: |
          python -m ruff check backend/src backend/tests scripts infra/observability/receiver.py --config backend/pyproject.toml
          python -m ruff format --check backend/src backend/tests scripts infra/observability/receiver.py --config backend/pyproject.toml
          python -m unittest discover -s scripts -p 'test_*.py'
          python -m mypy backend/src --config-file backend/pyproject.toml
          python scripts/check_repository_docs.py
      - name: Start isolated database
        run: |
          python scripts/ops.py db
          docker compose -p pf-evidencedesk-ci-maintenance -f infra/compose/compose.yaml -f infra/compose/integration.yaml up -d --wait db
      - name: Apply schema
        working-directory: backend
        env:
          PYTHONPATH: src
        run: |
          python -m alembic upgrade head
          ED_MIGRATION_DATABASE_URL="$ED_MAINTENANCE_TEST_OWNER_URL" python -m alembic upgrade head
      - name: Backend tests without a paid provider
        working-directory: backend
        env:
          PYTHONPATH: src
        run: python -m pytest -m 'not azure' --junitxml=../test-results/backend.xml
      - name: Validate pinned observability configuration
        run: python scripts/check_infra.py
      - name: Build backend
        run: python scripts/ops.py build api
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checks-backend
          path: |
            test-results/backend.xml
            docs/evidence/infra-config-check.json
          retention-days: 7
      - name: Stop runner project
        if: always()
        run: |
          python scripts/ops.py --observability stop
          docker compose -p pf-evidencedesk-ci-maintenance -f infra/compose/compose.yaml -f infra/compose/integration.yaml stop

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run prepare:assets
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: |
          mkdir -p artifacts
          npm audit --omit=dev --audit-level=high --json > artifacts/npm-audit-ci.json
      - name: Frontend evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checks-frontend
          path: frontend/artifacts/npm-audit-ci.json
          retention-days: 7

  browser-journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ED_AI_PROVIDER: disabled
      AZURE_OPENAI_API_KEY: ''
      ED_E2E_BASE_URL: http://127.0.0.1:3107
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and start isolated application
        run: |
          python scripts/ops.py --project pf-evidencedesk-e2e-ci --e2e build
          python scripts/ops.py --project pf-evidencedesk-e2e-ci --e2e db
          docker compose -p pf-evidencedesk-e2e-ci -f infra/compose/compose.yaml -f infra/compose/e2e.yaml run --rm --no-deps migrate
          python scripts/ops.py --project pf-evidencedesk-e2e-ci --e2e seed
          docker compose -p pf-evidencedesk-e2e-ci -f infra/compose/compose.yaml -f infra/compose/e2e.yaml run --rm --no-deps -v "$PWD/scripts:/ops:ro" seed python /ops/prepare_e2e.py
          python scripts/ops.py --project pf-evidencedesk-e2e-ci --e2e start
      - name: Install browser harness
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run prepare:assets
          npx playwright install --with-deps chromium
      - name: Run API-backed browser journeys once
        working-directory: frontend
        run: npm run test:e2e
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checks-browser
          path: |
            frontend/artifacts/e2e-results.json
            frontend/artifacts/screenshots
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
      - name: Stop isolated application
        if: always()
        run: python scripts/ops.py --project pf-evidencedesk-e2e-ci --e2e stop

  image-vulnerabilities:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [api, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build exact runtime image
        env:
          SCAN_SERVICE: ${{ matrix.service }}
        run: |
          python scripts/ops.py build "$SCAN_SERVICE"
          if [ "$SCAN_SERVICE" = api ]; then image=pf-evidencedesk-backend:local; else image=pf-evidencedesk-frontend:local; fi
          mkdir -p test-results
          image_id=$(docker image inspect "$image" --format '{{.Id}}')
          docker image inspect "$image_id" --format '{{json .Id}}' > "test-results/image-identity.json"
          docker save "$image_id" -o image.tar
      - name: Scan all known severities without hiding unfixed findings
        # Vulnerability scan only. Never upload raw secret scan matches as artifacts.
        run: |
          mkdir -p scan-private
          docker run --rm -v "$PWD:/scan:ro" -v "$PWD/scan-private:/results" aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image --input /scan/image.tar --scanners vuln --ignorefile /dev/null --format json --output /results/vulnerabilities.json --exit-code 0
          python scripts/publish_vulnerability_report.py scan-private/vulnerabilities.json test-results/vulnerabilities.json --archive image.tar --image-id-file test-results/image-identity.json
      - name: Gate HIGH and CRITICAL findings
        run: python scripts/check_vulnerability_report.py test-results/vulnerabilities.json
      - name: Scanner evidence including failed gates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-vulnerabilities-${{ matrix.service }}
          path: test-results
          retention-days: 7
