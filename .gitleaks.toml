title = "EvidenceDesk secret scanning"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "SHA-256 of the versioned tokenizer report; verified against the file bytes"
condition = "AND"
regexTarget = "match"
paths = ['''^(model-manifest\.json|experiments/reports/index\.json)$''']
regexes = ['''chunk-policy-tokenizers\.json"\s*:\s*"[a-f0-9]{64}"''']

[[rules.allowlists]]
description = "Internal Docker HTTP probe address, without credentials"
condition = "AND"
regexTarget = "match"
paths = ['''^scripts/check_observability\.py$''']
regexes = ['''api:8106/api/v1/health/live"''']

[[rules.allowlists]]
description = "Two exact SHA-256 source fingerprints in the reviewed restore build inventory"
condition = "AND"
regexTarget = "match"
paths = ['''^docs/evidence/restore-read-story/20260922T072246Z-492911fe/runtime-build-source\.json$''']
regexes = [
  '''0008_monthly_token_budget\.py"\s*:\s*"02551444fb7714176adb6d665544f8d473116484dc750fc196da8f5cbc1cb72a"''',
  '''api\.py"\s*:\s*"670d02686d27cac8e37065fda49fbd3460d046fb28a9f57fa0918347bb9b9a1a"''',
]
