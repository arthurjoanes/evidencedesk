stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        http: {endpoint: 0.0.0.0:4318}
storage:
  trace:
    backend: local
    local: {path: /var/tempo/blocks}
    wal: {path: /var/tempo/wal}
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 72h
backend_worker:
  compaction:
    block_retention: 72h
usage_report:
  reporting_enabled: false
