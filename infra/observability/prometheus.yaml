global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: {environment: local-lab, project: evidencedesk}
rule_files: [/etc/prometheus/alerts.yaml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: [api:8106]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: readiness
    metrics_path: /probe
    params: {module: [http_ready]}
    static_configs:
      - targets: [http://api:8106/api/v1/health/ready]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: probe:9115
  - job_name: collector-health
    metrics_path: /probe
    params: {module: [http_ready]}
    static_configs:
      - targets: [http://collector:13133/]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: probe:9115
  - job_name: model-readiness
    metrics_path: /probe
    params: {module: [http_ready]}
    file_sd_configs:
      - files: [/etc/prometheus/model-targets.json]
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: probe:9115
